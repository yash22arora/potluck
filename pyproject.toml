[project]
name = "potluck"
version = "0.1.0"
description = "A group-chat agent that works out what's for dinner and orders it over Swiggy MCP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # config + logging
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    # persistence
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    # scheduling
    "apscheduler>=3.10",
    # swiggy mcp
    "mcp>=2.1",
    # the MCP SDK 2.x transports use httpx2, which we import directly
    "httpx2>=2.12",
    "cryptography>=44.0",
    # models (provider-agnostic via init_chat_model)
    "langchain>=0.3.7",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.2",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["potluck"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's whole dependency system is calls in argument defaults. B008 is a
# false positive for these three and nothing else.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
